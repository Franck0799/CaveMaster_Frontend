<button
  class="theme-toggle-btn"
  (click)="toggleTheme()"
  [title]="getTooltip()"
  type="button">
  <span class="icon">
    <ng-container [ngSwitch]="currentTheme">
      <span *ngSwitchCase="'light'"><i class="fas fa-sun"></i></span>
      <span *ngSwitchCase="'dark'"><i class="fas fa-moon"></i></span>
      <span *ngSwitchCase="'auto'"><i class="fas fa-arrow-rotate-right"></i></span>
    </ng-container>
  </span>
</button>
